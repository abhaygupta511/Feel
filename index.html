<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:'Plus Jakarta Sans',sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.layout{min-height:100vh;padding:12px 12px 112px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px}.sidebar{background:#101015;border:1px solid #202027;border-radius:18px;padding:24px 16px;position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;margin:0 8px 32px}.brand img{width:40px;height:40px}.brand b{font-size:21px;letter-spacing:6px}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#9696a5;margin-top:2px}.navlabel{font-size:9px;color:#777784;letter-spacing:2px;margin:18px 10px 8px}.navbtn{width:100%;border:0;background:none;color:#aaaab6;text-align:left;padding:12px 11px;border-radius:10px;font-size:12px;font-weight:600;display:flex;gap:12px;align-items:center}.navbtn .ico{width:18px;font-size:16px;text-align:center}.navbtn:hover,.navbtn.active{background:#24242c;color:white}.navbtn.active .ico{color:var(--accent)}.sidebottom{margin-top:auto;padding:14px 10px;color:#767681;font-size:10px;line-height:1.6}.main{min-width:0;background:#0e0e13;border:1px solid #202027;border-radius:18px;padding:26px 30px 36px;overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.searchbox{display:flex;align-items:center;gap:10px;background:#1a1a22;border:1px solid #2b2b35;border-radius:30px;padding:0 17px;width:min(470px,65%)}.searchbox input{width:100%;border:0;outline:0;background:none;color:white;padding:13px 0;font-size:12px}.searchbox span{color:#9c9ca8}.topright{font-size:10px;color:#9696a5}.hero{min-height:260px;border-radius:18px;padding:32px;display:flex;align-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 78% 48%,#a78bfa66,transparent 26%),linear-gradient(115deg,#25223a,#171722 55%,#1b1b24);border:1px solid #343044}.hero:after{content:"♫";position:absolute;right:12%;top:-45px;font-size:280px;line-height:1;color:#ffffff0b;transform:rotate(-12deg)}.hero-copy{position:relative;z-index:1;max-width:570px}.eyebrow{color:var(--accent);font-size:9px;letter-spacing:3px;font-weight:700}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.06;letter-spacing:-3px;margin:13px 0}.hero p{font-size:12px;color:#c1bdcf;line-height:1.7;max-width:400px}.primary{border:0;border-radius:30px;padding:12px 18px;background:var(--accent);color:#151515;font-size:11px;font-weight:800;margin-top:10px}.section{margin-top:32px}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}.sectionhead h2{font-size:17px;margin:0;letter-spacing:-.4px}.sectionhead p{font-size:10px;color:var(--muted);margin:5px 0 0}.textbtn{background:none;border:0;color:var(--accent);font-size:10px}.moods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.mood{min-height:95px;border:1px solid #30303a;border-radius:13px;text-align:left;padding:15px;background:linear-gradient(135deg,#252333,#17171f);transition:.2s}.mood:hover{transform:translateY(-3px);border-color:#a78bfa}.mood span{font-size:20px}.mood b{display:block;font-size:12px;margin-top:9px}.mood small{font-size:9px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.song{min-width:0;background:#15151c;border:1px solid #24242d;border-radius:13px;padding:10px;position:relative}.song:hover{background:#1c1c25}.art{width:100%;aspect-ratio:1;border-radius:9px;background:linear-gradient(135deg,#393052,#1c3440);overflow:hidden;position:relative;display:grid;place-items:center;font-size:32px;color:#ffffffa0}.art img{width:100%;height:100%;object-fit:cover}.artplay{position:absolute;right:8px;bottom:8px;border:0;border-radius:50%;width:35px;height:35px;background:var(--accent);color:#151515;opacity:0;transform:translateY(5px);transition:.18s;font-size:13px}.song:hover .artplay{opacity:1;transform:none}.songtitle{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:11px 0 5px}.songartist{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.songactions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.songactions button{border:0;background:none;color:#9c9ca8;font-size:14px;padding:3px}.songactions button.liked{color:var(--accent)}.empty{grid-column:1/-1;border:1px dashed #373741;border-radius:12px;padding:28px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}.pageTitle{font-size:27px;letter-spacing:-1px;margin:4px 0 7px}.pageDesc{color:var(--muted);font-size:11px;margin:0 0 24px}.searchhint{font-size:10px;color:var(--muted);margin:12px 2px}.playlistrow{display:flex;align-items:center;gap:13px;padding:12px;border-bottom:1px solid #25252d}.playlistcover{width:50px;height:50px;border-radius:8px;background:linear-gradient(135deg,#a78bfa,#333);display:grid;place-items:center;font-size:20px}.playlistrow b{font-size:11px}.playlistrow small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.playlistrow button{margin-left:auto;border:1px solid #3a3a45;background:#202029;border-radius:20px;padding:7px 12px;font-size:9px}.player{position:fixed;z-index:10;bottom:0;left:0;right:0;min-height:88px;background:#14141bf5;border-top:1px solid #30303a;backdrop-filter:blur(24px);display:grid;grid-template-columns:minmax(180px,1fr) minmax(240px,1.3fr) minmax(130px,1fr);align-items:center;gap:20px;padding:12px 24px calc(12px + env(safe-area-inset-bottom))}.now{display:flex;align-items:center;gap:11px;min-width:0}.nowart{width:49px;height:49px;border-radius:8px;background:#302744;display:grid;place-items:center;overflow:hidden;flex:none}.nowart img{width:100%;height:100%;object-fit:cover}.nowmeta{min-width:0}.nowmeta b,.nowmeta small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowmeta b{font-size:10px}.nowmeta small{font-size:9px;color:var(--muted);margin-top:5px}.heart{border:0;background:none;color:#a1a1ad;margin-left:5px}.heart.liked{color:var(--accent)}.controls{text-align:center}.controlrow{display:flex;justify-content:center;align-items:center;gap:18px}.controlrow button{border:0;background:none;color:#a8a8b4;font-size:14px}.controlrow button.on{color:var(--accent)}.controlrow .play{width:34px;height:34px;border-radius:50%;background:white;color:#111;font-size:13px}.seekrow{display:flex;align-items:center;gap:9px;margin-top:9px;color:#8c8c99;font-size:8px}.seek{height:4px;background:#393943;border-radius:9px;flex:1;cursor:pointer;touch-action:none}.seek i{display:block;width:0;height:100%;border-radius:9px;background:var(--accent)}.playerextra{display:flex;align-items:center;justify-content:flex-end;gap:12px}.playerextra button{border:0;background:none;color:#aaa;font-size:13px}.playerextra input{width:85px;accent-color:var(--accent)}.mobilebar{display:none}.toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#282832;border:1px solid #444;border-radius:30px;padding:10px 16px;font-size:10px;z-index:30}
@media(max-width:1000px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.layout{grid-template-columns:190px minmax(0,1fr)}.main{padding:22px}}
@media(max-width:720px){.layout{display:block;padding:0 0 112px}.sidebar{display:none}.main{border:0;border-radius:0;padding:18px 15px 28px;min-height:100vh}.topbar{margin-bottom:18px}.topright{display:none}.searchbox{width:100%}.hero{min-height:225px;padding:23px}.hero:after{right:-10%;font-size:200px}.moods{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.player{grid-template-columns:1fr auto;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));min-height:82px}.nowart{width:42px;height:42px}.controls{grid-column:2;grid-row:1}.controlrow{gap:10px}.controlrow button{font-size:12px}.seekrow{margin-top:5px}.playerextra{display:none}.mobilebar{position:fixed;z-index:9;bottom:82px;left:0;right:0;display:flex;justify-content:space-around;background:#101016;border-top:1px solid #282832;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}.mobilebar button{border:0;background:none;color:#9999a5;font-size:9px;display:grid;gap:3px;justify-items:center}.mobilebar button.active{color:var(--accent)}.mobilebar span{font-size:17px}}
</style></head>
<body>
<div class="layout">
<aside class="sidebar"><div class="brand"><img src="assets/feel-mark.svg" alt="FEEL"><div><b>FEEL</b><small>MUSIC FOR EVERY MOOD</small></div></div>
<div class="navlabel">MENU</div><button class="navbtn active" data-page="home"><span class="ico">⌂</span>Home</button><button class="navbtn" data-page="search"><span class="ico">⌕</span>Search</button><button class="navbtn" data-page="library"><span class="ico">▤</span>Your Library</button>
<div class="navlabel">YOUR MUSIC</div><button class="navbtn" data-page="liked"><span class="ico">♥</span>Liked Songs</button><button class="navbtn" data-page="recent"><span class="ico">◷</span>Recently Played</button><button class="navbtn" data-page="playlists"><span class="ico">▧</span>Playlists</button>
<div class="sidebottom">Your music. Your moods.<br>Made to feel like you.</div></aside>
<main class="main"><header class="topbar"><div class="searchbox"><span>⌕</span><input id="searchInput" placeholder="What do you want to listen to?" autocomplete="off"><span>↵</span></div><div class="topright">YOUR PERSONAL MUSIC SPACE</div></header><div id="view"></div></main>
</div>
<nav class="mobilebar"><button class="active" data-page="home"><span>⌂</span>Home</button><button data-page="search"><span>⌕</span>Search</button><button data-page="library"><span>▤</span>Library</button><button data-page="liked"><span>♥</span>Liked</button></nav>
<footer class="player"><div class="now"><div class="nowart" id="nowArt">♫</div><div class="nowmeta"><b id="nowTitle">Choose your first song</b><small id="nowArtist">FEEL · Music for every mood</small></div><button class="heart" id="nowLike" title="Like song">♡</button></div><div class="controls"><div class="controlrow"><button id="shuffle" title="Shuffle">⤨</button><button id="prev" title="Previous">◂◂</button><button class="play" id="toggle" title="Play">▶</button><button id="next" title="Next">▸▸</button><button id="repeat" title="Repeat">↻</button></div><div class="seekrow"><span id="elapsed">0:00</span><div class="seek" id="seek"><i id="progress"></i></div><span id="duration">0:00</span></div></div><div class="playerextra"><button id="queueBtn" title="Queue">☷</button><span>◖</span><input id="volume" type="range" min="0" max="1" step=".01" value=".75"></div></footer>
<audio id="audio" preload="none"></audio>
<script>
const API_HOSTS=['https://api.audius.co/v1','https://discoveryprovider.audius.co/v1'],FREE_API='https://api.freetouse.com/v3',audio=document.querySelector('#audio');
const $=s=>document.querySelector(s),safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readStore(key){try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
const state={page:'home',tracks:[],current:-1,playing:null,queue:[],liked:readStore('feel-liked'),recent:readStore('feel-recent'),playlists:readStore('feel-playlists'),shuffle:false,repeat:false,busy:false,playToken:0,searchToken:0};
const moods=[['happy','☀️','Happy','Feel-good energy'],['sad','🌧️','Sad','Let it all out'],['lonely','🌙','Lonely','For the quiet hours'],['lost','🌫️','Lost','Find your direction'],['angry','⚡','Angry','Release the pressure'],['peaceful','🍃','Peaceful','Slow everything down'],['love','💗','In love','Stay in the feeling'],['numb','🫧','Numb','When words don’t work']];
const moodQueries={happy:['upbeat indie pop song','happy pop music'],sad:['sad acoustic song','melancholic indie song'],lonely:['late night indie song','slow alternative pop'],lost:['dream pop song','indie alternative song'],angry:['alternative rock song','hard rock music'],peaceful:['acoustic chill song','soft instrumental music'],love:['romantic indie pop song','love acoustic song'],numb:['slow indie song','emotional alternative song']};
const words={happy:['happy','good','excited','great','smile','joy','khush','mast'],sad:['sad','cry','hurt','miss','breakup','dukhi','rona'],lonely:['alone','lonely','isolated','akela','tanha'],lost:['lost','confused','future','stuck','career','bhatak'],angry:['angry','mad','frustrated','gussa','irritated'],peaceful:['calm','peace','relaxed','sukoon','shaant'],love:['love','crush','romantic','pyaar','ishq'],numb:['empty','numb','blank','nothing','kuch nahi']};
const artist=t=>t._source==='freetouse'?(Array.isArray(t.artists)?t.artists.map(a=>typeof a==='string'?a:a.name||a[1]?.name).filter(Boolean).join(', '):t.artist?.name||t.artist_name||'Independent artist'):t.user?.name||'Independent artist';
const art=t=>t._source==='freetouse'?(t.thumbnail_url||t.thumbnail||t.cover_url||t.image||''):t.artwork?.['480x480']||t.artwork?.['150x150']||'';
const title=t=>t.title||t.name||'Untitled track',fmt=n=>{n=Math.floor(n||0);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
function persist(){try{localStorage.setItem('feel-liked',JSON.stringify(state.liked));localStorage.setItem('feel-recent',JSON.stringify(state.recent));localStorage.setItem('feel-playlists',JSON.stringify(state.playlists))}catch(e){console.warn('FEEL could not save local library',e);toast('Storage is full or unavailable. Your latest changes may not be saved.')}}
function toast(s){let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2300)}
async function audius(path){const attempts=API_HOSTS.map(async host=>{const u=new URL(host+path);u.searchParams.set('app_name','FEEL');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);try{const r=await fetch(u,{signal:controller.signal});if(!r.ok)throw Error('Audius '+r.status);const j=await r.json();if(j.data===undefined)throw Error(j.error||'Bad response');return j.data}finally{clearTimeout(timer)}});return Promise.any(attempts)}
async function freeSearch(q){let u=new URL(FREE_API+'/music/tracks/search');u.searchParams.set('query',q);u.searchParams.set('limit','12');u.searchParams.set('order','plays');u.searchParams.set('sort','desc');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);try{let r=await fetch(u,{signal:controller.signal});if(!r.ok)throw Error('Free To Use '+r.status);let j=await r.json();return (j.data||[]).filter(t=>!t.is_premium).map(t=>({...t,_source:'freetouse'}))}finally{clearTimeout(timer)}}
function normalize(list,source){return list.map(t=>({...t,_source:source}))}
function isSong(t){let raw=t.duration_seconds??t.duration??t.duration_ms??t.length??t.audio_duration??0,d=Number(raw);if(t.duration_ms!==undefined&&t.duration_seconds===undefined&&t.duration===undefined)d/=1000;else if(d>10000)d/=1000;let meta=(title(t)+' '+(t.genre||'')+' '+(Array.isArray(t.tags)?t.tags.join(' '):t.tags||'')+' '+(Array.isArray(t.categories)?t.categories.join(' '):t.categories||'')).toLowerCase();return Number.isFinite(d)&&d>=60&&!/(sound effect|sfx|foley|field recording|notification|alarm sound|doorbell|whoosh|white noise|ambience loop)/i.test(meta)}
async function searchMusic(q){q=q.trim();if(!q){toast('Type a song or artist name first');return}const token=++state.searchToken;state.busy=true;renderLoading('Searching songs and artists…');try{const tasks=await Promise.allSettled([audius('/tracks/search?query='+encodeURIComponent(q)+'&limit=24'),freeSearch(q)]);if(token!==state.searchToken)return;let list=[];tasks.forEach((x,i)=>{if(x.status==='fulfilled')list.push(...normalize(x.value,i===0?'audius':'freetouse'));else console.warn('Search source error',x.reason)});list=list.filter(isSong);const seen=new Set();list=list.filter(t=>{const k=t._source+':'+t.id;if(seen.has(k))return false;seen.add(k);return true});list.sort((a,b)=>(Number(b.favorite_count||b.plays||0)-Number(a.favorite_count||a.plays||0)));state.tracks=list;state.current=-1;renderResults('Search results','Songs matching “'+q+'”',list);if(!list.length)addExternalSearch(q+' official song','Search this song on YouTube ↗')}catch(e){console.error(e);renderResults('Search results','Music providers could not be reached. You can still look up the song externally.',[]);addExternalSearch(q+' official song','Search this song on YouTube ↗')}finally{if(token===state.searchToken)state.busy=false}}
function renderLoading(msg){$('#view').innerHTML='<h1 class="pageTitle">Just a moment…</h1><p class="pageDesc">'+safe(msg)+'</p><div class="empty">Finding music for you…</div>'}
function songCard(t,i){let liked=state.liked.some(x=>x.id===t.id&&x._source===t._source);let yt='https://www.youtube.com/results?search_query='+encodeURIComponent(title(t)+' '+artist(t)+' official audio');return '<article class="song"><div class="art">'+(art(t)?'<img loading="lazy" src="'+safe(art(t))+'" alt="">':'♫')+'<button class="artplay" data-play="'+i+'">▶</button></div><div class="songtitle" title="'+safe(title(t))+'">'+safe(title(t))+'</div><div class="songartist">'+safe(artist(t))+'</div><div class="songactions"><button class="'+(liked?'liked':'')+'" data-like="'+i+'" title="Like">♥</button><button data-add="'+i+'" title="Add to queue">＋</button><a href="'+yt+'" target="_blank" rel="noopener noreferrer" title="Find this song on YouTube">YT ↗</a></div></article>'}
function bindCards(){document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(Number(b.dataset.play)));document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>like(state.tracks[Number(b.dataset.like)]));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state.queue.push(state.tracks[Number(b.dataset.add)]);toast('Added to queue')})}
function addExternalSearch(q,label){const box=document.querySelector('#view .empty');if(!box)return;const a=document.createElement('a');a.href='https://www.youtube.com/results?search_query='+encodeURIComponent(q);a.target='_blank';a.rel='noopener noreferrer';a.textContent=label||'Search on YouTube ↗';a.style.cssText='display:inline-block;margin-top:14px;color:var(--accent);font-weight:700';box.appendChild(document.createElement('br'));box.appendChild(a)}
function renderResults(h,sub,list){state.tracks=list;state.current=-1;$('#view').innerHTML='<section><h1 class="pageTitle">'+safe(h)+'</h1><p class="pageDesc">'+safe(sub)+'</p><div class="cards">'+(list.length?list.map(songCard).join(''):'<div class="empty">No songs found in the connected free catalogues.<br>Try the exact title, artist name, or a shorter search.</div>')+'</div></section>';bindCards()}
function renderHome(){let featured=state.recent.slice(0,5);$('#view').innerHTML='<section class="hero"><div class="hero-copy"><div class="eyebrow">YOUR SOUND. YOUR SPACE.</div><h1>Every mood<br>has a soundtrack.</h1><p>Find songs for the way you feel. Search artists, discover new music and build your own library.</p><button class="primary" id="explore">Explore music ↗</button></div></section><section class="section"><div class="sectionhead"><div><h2>Find your mood</h2><p>Choose how you feel right now.</p></div></div><div class="moods">'+moods.map(m=>'<button class="mood" data-mood="'+m[0]+'"><span>'+m[1]+'</span><b>'+m[2]+'</b><small>'+m[3]+'</small></button>').join('')+'</div></section><section class="section"><div class="sectionhead"><div><h2>Recently played</h2><p>Pick up where you left off.</p></div><button class="textbtn" data-go="recent">See all</button></div><div class="cards">'+(featured.length?featured.map((t,i)=>songCard(t,i)).join(''):'<div class="empty">Your listening history will appear here.</div>')+'</div></section>';
$('#explore').onclick=()=>go('search');document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>loadMood(b.dataset.mood));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));state.tracks=featured;bindCards()}
async function loadMood(m){const token=++state.searchToken,qs=moodQueries[m]||moodQueries.happy;state.busy=true;go('search',false);renderLoading('Finding '+m+' songs…');try{const tasks=await Promise.allSettled(qs.flatMap(q=>[audius('/tracks/search?query='+encodeURIComponent(q)+'&limit=12'),freeSearch(q)]));if(token!==state.searchToken)return;let list=[];tasks.forEach((x,i)=>{if(x.status==='fulfilled')list.push(...normalize(x.value,i%2===0?'audius':'freetouse'));else console.warn('Mood source failed',x.reason)});const seen=new Set();list=list.filter(t=>{let k=t._source+':'+t.id;if(seen.has(k))return false;seen.add(k);return isSong(t)});state.tracks=list;state.current=-1;renderResults(m[0].toUpperCase()+m.slice(1)+' mood','Songs picked for this mood',list);if(!list.length)addExternalSearch(m+' mood songs','Find '+m+' songs on YouTube ↗')}catch(e){console.error(e);renderResults('Mood unavailable','Could not load music right now',[]);addExternalSearch(m+' mood songs','Find '+m+' songs on YouTube ↗')}finally{if(token===state.searchToken)state.busy=false}}
function go(page,render=true){state.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(render)renderPage()}
function renderPage(){if(state.page==='home')return renderHome();if(state.page==='search'){$('#view').innerHTML='<h1 class="pageTitle">Search</h1><p class="pageDesc">Find songs by title, artist or mood.</p><div class="searchhint">Try a song title or singer name in the search bar above.</div><div id="searchresults"></div>';return}if(state.page==='liked')return renderResults('Liked Songs','Your saved favourites',state.liked);if(state.page==='recent')return renderResults('Recently Played','Your listening history',state.recent);if(state.page==='library'||state.page==='playlists'){let rows=state.playlists.map((p,i)=>'<div class="playlistrow"><div class="playlistcover">♫</div><div><b>'+safe(p.name)+'</b><small>'+p.songs.length+' songs · Your playlist</small></div><button data-openpl="'+i+'">Open playlist</button></div>').join('');$('#view').innerHTML='<h1 class="pageTitle">Your Library</h1><p class="pageDesc">Your favourites and playlists, saved on this device.</p><button class="primary" id="newPlaylist">＋ Create playlist</button><div class="section">'+rows+'</div>';$('#newPlaylist').onclick=createPlaylist;document.querySelectorAll('[data-openpl]').forEach(b=>b.onclick=()=>openPlaylist(Number(b.dataset.openpl)));return}}
function createPlaylist(){let name=prompt('Name your playlist');if(!name?.trim())return;state.playlists.push({name:name.trim(),songs:[]});persist();renderPage();toast('Playlist created')}
function openPlaylist(i){let p=state.playlists[i];state.tracks=p.songs;state.current=-1;renderResults(p.name,'Your personal playlist',p.songs);let btn=document.createElement('button');btn.className='primary';btn.textContent='Add current song to this playlist';btn.onclick=()=>{if(!currentTrack())return toast('Play a song first');p.songs.push(currentTrack());persist();toast('Song added to playlist')};$('#view').prepend(btn)}
function currentTrack(){return state.playing}
function like(t){if(!t)return;let i=state.liked.findIndex(x=>x.id===t.id&&x._source===t._source);if(i>=0)state.liked.splice(i,1);else state.liked.unshift(t);persist();updatePlayer();if(state.page==='liked')renderPage();else bindCards();toast(i>=0?'Removed from Liked Songs':'Added to Liked Songs')}
function updatePlayer(){let t=currentTrack();if(!t)return;$('#nowTitle').textContent=title(t);$('#nowArtist').textContent=artist(t)+' · '+(t._source==='freetouse'?'Free To Use':'Audius');$('#nowArt').innerHTML=art(t)?'<img src="'+safe(art(t))+'" alt="">':'♫';let liked=state.liked.some(x=>x.id===t.id&&x._source===t._source);$('#nowLike').textContent=liked?'♥':'♡';$('#nowLike').classList.toggle('liked',liked)}
async function play(i){const t=state.tracks[i];if(!t)return;const token=++state.playToken;state.current=i;state.playing=t;state.queue=state.tracks.slice(i+1);updatePlayer();state.recent=state.recent.filter(x=>!(x.id===t.id&&x._source===t._source));state.recent.unshift(t);state.recent=state.recent.slice(0,40);persist();$('#toggle').textContent='…';const rawAudio=t.files?.mp3?.url||t.files?.mp3?.src||t.files?.mp3||t.audio_url||t.audio?.url||t.audio||t.stream_url||t.download_url;const urls=t._source==='freetouse'?[typeof rawAudio==='string'?rawAudio:rawAudio?.url].filter(u=>typeof u==='string'&&/^https?:\/\//i.test(u)):API_HOSTS.map(h=>h+'/tracks/'+encodeURIComponent(t.id)+'/stream?app_name=FEEL');let lastError;for(const url of urls){if(token!==state.playToken)return;try{audio.pause();audio.removeAttribute('src');audio.load();audio.src=url;audio.load();await audio.play();if(token===state.playToken)$('#toggle').textContent='Ⅱ';return}catch(e){lastError=e;console.warn('Playback source failed',url,e)}}if(token===state.playToken){$('#toggle').textContent='▶';toast('This track is unavailable. Try another song.')}console.warn('FEEL playback failed',lastError)}
function next(){if(state.repeat&&currentTrack()){audio.currentTime=0;audio.play().catch(()=>{});return}if(state.queue.length){const t=state.queue.shift();state.tracks=[t,...state.tracks];play(0);return}if(!state.tracks.length)return;let n=state.shuffle?Math.floor(Math.random()*state.tracks.length):(state.current+1)%state.tracks.length;play(n)}
function previous(){if(audio.currentTime>3){audio.currentTime=0;return}if(!state.tracks.length)return;play((state.current-1+state.tracks.length)%state.tracks.length)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){go('search');searchMusic(e.target.value)}});
$('#nowLike').onclick=()=>like(currentTrack());$('#toggle').onclick=()=>{if(!audio.src){if(state.tracks.length)play(Math.max(0,state.current));return}if(audio.paused)audio.play().then(()=>$('#toggle').textContent='Ⅱ').catch(()=>toast('Playback could not start'));else{audio.pause();$('#toggle').textContent='▶'}};$('#next').onclick=next;$('#prev').onclick=previous;$('#shuffle').onclick=()=>{state.shuffle=!state.shuffle;$('#shuffle').classList.toggle('on',state.shuffle);toast(state.shuffle?'Shuffle on':'Shuffle off')};$('#repeat').onclick=()=>{state.repeat=!state.repeat;$('#repeat').classList.toggle('on',state.repeat);toast(state.repeat?'Repeat current song on':'Repeat off')};$('#queueBtn').onclick=()=>toast(state.queue.length?state.queue.length+' songs in queue':'Your queue is empty');$('#volume').oninput=e=>audio.volume=Number(e.target.value);audio.volume=.75;
audio.ontimeupdate=()=>{$('#elapsed').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration);$('#progress').style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%'};audio.onerror=()=>{if(audio.src&&audio.error)$('#toggle').textContent='▶'};audio.onended=next;let dragging=false;function seek(x){if(!audio.duration)return;let r=$('#seek').getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(x-r.left)/r.width))*audio.duration}$('#seek').onpointerdown=e=>{dragging=true;$('#seek').setPointerCapture(e.pointerId);seek(e.clientX)};$('#seek').onpointermove=e=>{if(dragging)seek(e.clientX)};$('#seek').onpointerup=()=>dragging=false;$('#seek').onpointercancel=()=>dragging=false;
renderHome();audio.volume=.75;
</script></body></html>
